<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Локальний iframe — Links Highlighter</title>
  <style>
    body {
      margin: 0;
      padding: 12px;
      font: 14px/1.45 system-ui, sans-serif;
    }

    a,
    button {
      display: block;
      margin: 6px 0;
    }
  </style>
</head>
<body>
  <p>Посилання у локальному фреймі класифікуються відносно адреси цього фрейму.</p>
  <a href="/links-test/iframe-target.html">Internal link in iframe</a>
  <a href="https://example.org/iframe-external">External dofollow in iframe</a>
  <a href="https://example.org/iframe-nofollow" rel="nofollow">External nofollow in iframe</a>
  <button type="button" onclick="window.location.assign('#iframe-js')">JS navigation in iframe</button>
  <button type="button" onclick="if (false) window.location.href = frameNextUrl">Dynamic JS destination in iframe</button>
</body>
</html>
